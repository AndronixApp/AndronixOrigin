# Dev pack: Java. The distro's default JDK is an LTS on every lineup base
# (21 on Debian 13 and Manjaro ARM, 25 on Ubuntu 26.04 and Kali); Maven.
PACK_ID=java
PACK_NAME="Java"
PACK_DESC="A JDK LTS (the distro's default) and Maven"
PACK_PKGS_apt="default-jdk maven"
PACK_PKGS_dnf="java-25-openjdk-devel|java-21-openjdk-devel maven"
PACK_PKGS_pacman="jdk21-openjdk|jdk-openjdk maven"
PACK_PKGS_apk="openjdk21|openjdk17 maven"
PACK_PKGS_xbps="openjdk21|openjdk17 apache-maven"
PACK_POST=""
PACK_CHECK="java -version 2>&1 | head -1 && javac -version && mvn -v | head -1"
PACK_HINT="VSCodium: install the Java extension pack from Open VSX."
PACK_DISK_MB=450
