# Dev pack: databases. PostgreSQL (server + client), SQLite, and DB Browser
# for SQLite as the desktop client. proot has no systemd, so the server is
# started with the andronix-postgres helper (installed by PACK_POST).
PACK_ID=db
PACK_NAME="Databases"
PACK_DESC="PostgreSQL, SQLite and DB Browser for SQLite"
PACK_PKGS_apt="postgresql postgresql-client sqlite3 sqlitebrowser?"
PACK_PKGS_dnf="postgresql-server postgresql sqlite sqlitebrowser?"
PACK_PKGS_pacman="postgresql sqlite sqlitebrowser?"
PACK_PKGS_apk="postgresql postgresql-client sqlite sqlitebrowser?"
PACK_PKGS_xbps="postgresql postgresql-client sqlite sqlitebrowser?"
PACK_FILES="andronix-postgres:/usr/local/bin/andronix-postgres:755"
PACK_POST=""
# Run before remove: stop a server the helper started.
PACK_PRE_REMOVE="command -v andronix-postgres >/dev/null && andronix-postgres stop >/dev/null 2>&1; true"
# Deleted only by 'pack remove --purge db': the databases (and any cluster
# moved aside as .broken-<time>) and the log. Globs allowed.
PACK_PURGE="/var/lib/andronix-postgres /var/lib/andronix-postgres.broken-* /var/log/andronix-postgres.log"
PACK_CHECK="sqlite3 --version && psql --version && andronix-postgres check"
PACK_HINT="Start PostgreSQL with: sudo andronix-postgres start (then psql). Stop it before you leave: sudo andronix-postgres stop."
PACK_DISK_MB=200
