# Dev pack: Python. One file per pack; package lists per family, like
# desktops/*.conf. Versions are the distro's own packages.
# Syntax in PACK_PKGS_*: "a|b" = the first one the distro has; "x?" =
# optional (skipped if the distro lacks it).
PACK_ID=python
PACK_NAME="Python"
PACK_DESC="Python 3 with pip, venv, pipx and a C compiler for native wheels"
PACK_PKGS_apt="python3 python3-pip python3-venv python3-dev pipx build-essential"
PACK_PKGS_dnf="python3 python3-pip python3-devel pipx gcc gcc-c++ make"
PACK_PKGS_pacman="python python-pip python-pipx base-devel?"
PACK_PKGS_apk="python3 py3-pip py3-virtualenv pipx build-base python3-dev"
PACK_PKGS_xbps="python3 python3-pip python3-pipx base-devel python3-devel"
# PACK_POST runs as root after install; PACK_CHECK (as root) proves it works.
PACK_POST=""
PACK_CHECK="python3 --version && python3 -m venv /tmp/andronix-pack-venv && /tmp/andronix-pack-venv/bin/pip --version && rm -rf /tmp/andronix-pack-venv && pipx --version"
PACK_HINT="Make a project env: python3 -m venv .venv && . .venv/bin/activate. Tools: pipx install <tool>."
PACK_DISK_MB=520
