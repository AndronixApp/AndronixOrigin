# Dev pack: Go from the distro, and gopls for editors.
PACK_ID=go
PACK_NAME="Go"
PACK_DESC="The Go toolchain and gopls"
PACK_PKGS_apt="golang-go gopls?"
PACK_PKGS_dnf="golang gopls?"
PACK_PKGS_pacman="go gopls?"
PACK_PKGS_apk="go gopls?"
PACK_PKGS_xbps="go gopls?"
PACK_POST=""
PACK_CHECK="go version && go env GOPATH"
PACK_HINT="Binaries from go install land in ~/go/bin; add it to PATH."
PACK_DISK_MB=400
