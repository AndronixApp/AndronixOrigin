# Dev pack: Node.js (the distro's LTS) with npm and corepack (yarn, pnpm).
PACK_ID=node
PACK_NAME="Node.js"
PACK_DESC="Node.js with npm, and corepack for yarn and pnpm"
PACK_PKGS_apt="nodejs npm node-corepack?"
PACK_PKGS_dnf="nodejs|nodejs24|nodejs22 nodejs-npm|nodejs24-npm|nodejs22-npm"
PACK_PKGS_pacman="nodejs npm corepack?"
PACK_PKGS_apk="nodejs npm"
PACK_PKGS_xbps="nodejs"
PACK_POST="command -v corepack >/dev/null 2>&1 && corepack enable || true"
PACK_CHECK="node --version && npm --version"
PACK_HINT="Global npm packages go to ~/.local: npm config set prefix ~/.local. yarn/pnpm: corepack enable (done if available)."
PACK_DISK_MB=200
