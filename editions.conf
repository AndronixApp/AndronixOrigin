# Modded editions the installer can install with --edition <id>:
#   <id>="<distro> <desktop> [early]"
# "early": early access, for Andronix Premium and Modded Pass owners before
# the general release (products-api decides; a refused download says so).
# The paid lineup, "Modded 2.0",
# and the archived "Classic" editions (legacy-*), rebuilt on
# current bases. The download is
# <distro>-<ver>-<desktop>-modded-<cpu>.tar.xz for the lineup and
# <id>-<ver>-<cpu>.tar.xz for the legacy-* ones.
ubuntu-xfce="ubuntu xfce"
ubuntu-kde="ubuntu kde"
debian-xfce="debian xfce"
manjaro-xfce="manjaro xfce"
kali-xfce="kali xfce"
legacy-ubuntu-xfce="ubuntu xfce"
legacy-ubuntu-kde="ubuntu kde"
legacy-manjaro="manjaro xfce"
legacy-debian="debian xfce"
