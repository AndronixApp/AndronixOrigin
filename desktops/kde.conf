# KDE Plasma 6, X11 session under VNC (no Wayland, no systemd). A minimal
# plasma-desktop set, not kde-standard. Needs a phone with 4 GB of RAM or
# more; the installer warns below DE_MIN_RAM_MB.

DE_ID=kde

DE_NAME="KDE Plasma"
DE_SESSION="startplasma-x11"

# Distros this desktop is verified and documented on; others are refused
# with a message naming these. (Empty: every distro with a package list.)
DE_DISTROS="ubuntu debian kali"

# Ubuntu 26.04 moved startplasma-x11 into plasma-session-x11 (optional
# below); Debian 13 and Kali still ship it in plasma-workspace.
DE_PKGS_apt="plasma-desktop kwin-x11 systemsettings konsole dolphin breeze breeze-icon-theme kde-cli-tools dbus-x11 xauth fonts-noto-core"
DE_PKGS_OPTIONAL_apt="plasma-session-x11 qt6-svg-plugins librsvg2-common"
# Not offered yet on the other families (untested; Fedora dropped the
# Plasma X11 session).
DE_PKGS_dnf=""
DE_PKGS_pacman=""
DE_PKGS_apk=""
DE_PKGS_xbps=""

# System-wide KDE defaults (/etc/xdg/<file>, "<file>:<group>:<key>=<value>;..."):
# no compositing over VNC, no Baloo indexing, no screen locking (a locked
# VNC desktop can't be unlocked under proot), no KWallet prompts.
DE_XDG_CONFIG="kwinrc:Compositing:Enabled=false;baloofilerc:Basic Settings:Indexing-Enabled=false;kscreenlockerrc:Daemon:Autolock=false;kscreenlockerrc:Daemon:LockOnResume=false;kwalletrc:Wallet:Enabled=false;kwalletrc:Wallet:First Use=false"

# Autostart entries that fail or waste memory under proot.
DE_AUTOSTART_HIDE="polkit-kde-authentication-agent-1 baloo_file org.kde.discover.notifier powerdevil"

# The light profile (andronix tune, automatic below 3 GB of RAM).
DE_LIGHT_XDG_CONFIG="kdeglobals:KDE:AnimationDurationFactor=0;dolphinrc:PreviewSettings:Plugins="
DE_LIGHT_AUTOSTART_HIDE="at-spi-dbus-bus kaccess org.kde.kdeconnect.daemon tracker-miner-fs-3 xembedsniproxy"

DE_DISK_MB=2500
DE_MIN_RAM_MB=4000
