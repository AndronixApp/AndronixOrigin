# LXQt 2.x. One file per desktop; package lists per family.

DE_ID=lxqt
DE_NAME="LXQt"
DE_SESSION="startlxqt"

# lxqt-core pulls no window manager, so openbox is listed explicitly.
DE_PKGS_apt="lxqt-core openbox breeze-icon-theme dbus-x11 featherpad fonts-dejavu-core sensible-utils"
DE_PKGS_dnf="lxqt-session lxqt-x11-session lxqt-panel lxqt-runner lxqt-config lxqt-notificationd lxqt-globalkeys lxqt-qtplugin lxqt-themes pcmanfm-qt qterminal featherpad openbox dbus-x11 dejavu-sans-fonts dejavu-sans-mono-fonts"
DE_PKGS_pacman="lxqt-session lxqt-panel lxqt-runner lxqt-config lxqt-globalkeys lxqt-notificationd lxqt-qtplugin lxqt-themes lxqt-menu-data lxqt-about pcmanfm-qt qterminal openbox obconf-qt breeze-icons ttf-dejavu dbus"
DE_PKGS_apk="lxqt-session lxqt-panel lxqt-runner lxqt-config lxqt-globalkeys lxqt-notificationd lxqt-qtplugin lxqt-themes lxqt-menu-data lxqt-about pcmanfm-qt qterminal openbox obconf-qt breeze-icons font-dejavu dbus dbus-x11 gsettings-desktop-schemas librsvg"
DE_PKGS_xbps="lxqt-session lxqt-panel lxqt-runner lxqt-config lxqt-globalkeys lxqt-notificationd lxqt-qtplugin lxqt-themes lxqt-menu-data lxqt-about pcmanfm-qt qterminal openbox obconf-qt breeze-icons dejavu-fonts-ttf dbus dbus-x11"

# Installed where the distro has them (skipped otherwise): Qt's SVG image
# plugin, without which the panel's menu button has no icon, and GTK's SVG
# loader.
DE_PKGS_OPTIONAL_apt="qt6-svg-plugins libqt5svg5 librsvg2-common"
DE_PKGS_OPTIONAL_dnf="qt6-qtsvg librsvg2"
DE_PKGS_OPTIONAL_pacman="qt6-svg librsvg"
DE_PKGS_OPTIONAL_apk="qt6-qtsvg librsvg"
DE_PKGS_OPTIONAL_xbps="qt6-svg librsvg"

# /etc/xdg/autostart entries that fail under proot (no polkitd, no
# logind or upower), hidden so they don't pop up error dialogs.
DE_AUTOSTART_HIDE="lxqt-policykit-agent lxqt-powermanagement pulseaudio tracker-miner-fs-3 geoclue-demo-agent update-notifier xiccd print-applet blueman nm-applet org.gnome.Evolution-alarm-notify"

# The light profile (andronix tune, automatic below 3 GB of RAM).
DE_LIGHT_XDG_CONFIG="pcmanfm-qt/lxqt/settings.conf:Thumbnail:ShowThumbnails=false"
DE_LIGHT_AUTOSTART_HIDE="at-spi-dbus-bus tracker-miner-fs-3 lxqt-powermanagement"

# Approximate installed size for the free-space check (MB), and RAM hint.
DE_DISK_MB=1200
DE_MIN_RAM_MB=0
