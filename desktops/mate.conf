# MATE. One file per desktop; package lists per family.

DE_ID=mate
DE_NAME="MATE"
DE_SESSION="mate-session"

# Ubuntu's default panel layout ("familiar") uses the brisk menu, the
# indicator applet and the trash applet (mate-applets); without them the
# panel has no menu and shows an error dialog per missing applet.
DE_PKGS_apt="mate-desktop-environment-core mate-applet-brisk-menu mate-indicator-applet mate-applets dbus-x11 pluma fonts-dejavu-core"
DE_PKGS_dnf="mate-session-manager marco mate-panel caja mate-settings-daemon mate-control-center mate-terminal mate-menus mate-themes mate-icon-theme mate-notification-daemon pluma dbus-x11 dejavu-sans-fonts dejavu-sans-mono-fonts"
DE_PKGS_pacman="caja marco mate-backgrounds mate-control-center mate-desktop mate-icon-theme mate-menus mate-notification-daemon mate-panel mate-session-manager mate-settings-daemon mate-themes mate-terminal pluma dbus ttf-dejavu"
DE_PKGS_apk="caja marco mate-backgrounds mate-control-center mate-desktop mate-icon-theme mate-menus mate-notification-daemon mate-panel mate-session-manager mate-settings-daemon mate-themes mate-terminal pluma dbus dbus-x11 font-dejavu gsettings-desktop-schemas librsvg"
DE_PKGS_xbps="caja marco mate-backgrounds mate-control-center mate-desktop mate-icon-theme mate-menus mate-notification-daemon mate-panel mate-session-manager mate-settings-daemon mate-themes mate-terminal pluma dbus dbus-x11 dejavu-fonts-ttf"

# Installed where the distro has them: GTK's SVG icon loader (Ubuntu 24.04
# shows PNG fallback icons without it).
DE_PKGS_OPTIONAL_apt="librsvg2-common"
DE_PKGS_OPTIONAL_dnf="librsvg2"

# /etc/xdg/autostart entries that fail under proot (no polkitd, no
# logind or upower), hidden so they don't pop up error dialogs.
DE_AUTOSTART_HIDE="polkit-mate-authentication-agent-1 mate-power-manager"

# Under proot everything runs as root, and caja refuses to draw the desktop
# as root; started by mate-session it exits at once and is restarted in a
# loop: black desktop, no icons. --force-desktop overrides the root check.
# Phase=Panel: mate-panel never registers with mate-session under proot, so
# the Desktop phase would wait 30 s. Format: "<file.desktop>:<Key>=<value>;..."
DE_DESKTOP_EDITS="caja.desktop:Exec=caja --force-desktop;caja.desktop:X-MATE-Autostart-Phase=Panel"

# The light profile (andronix tune, automatic below 3 GB of RAM).
DE_LIGHT_GSETTINGS="org.mate.Marco.general compositing-manager false;org.mate.caja.preferences show-image-thumbnails 'never';org.mate.interface enable-animations false"
DE_LIGHT_AUTOSTART_HIDE="at-spi-dbus-bus tracker-miner-fs-3 mate-power-manager mate-screensaver"

# Approximate installed size for the free-space check (MB), and RAM hint.
DE_DISK_MB=1400
DE_MIN_RAM_MB=0
