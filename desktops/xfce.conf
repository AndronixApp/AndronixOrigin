# XFCE 4.20. One file per desktop; package lists per family.

DE_ID=xfce
DE_NAME="XFCE"
DE_SESSION="startxfce4"

DE_PKGS_apt="xfce4 xfce4-terminal dbus-x11 adwaita-icon-theme fonts-dejavu-core mousepad sensible-utils"
DE_PKGS_dnf="xfce4-session xfwm4 xfce4-panel xfdesktop xfce4-settings xfce4-terminal Thunar xfce4-whiskermenu-plugin xfce4-appfinder dbus-x11 adwaita-icon-theme dejavu-sans-fonts dejavu-sans-mono-fonts mousepad"
DE_PKGS_pacman="xfce4 xfce4-whiskermenu-plugin mousepad dbus adwaita-icon-theme ttf-dejavu"
DE_PKGS_apk="xfce4 xfce4-terminal mousepad dbus dbus-x11 adwaita-icon-theme font-dejavu gsettings-desktop-schemas librsvg"
DE_PKGS_xbps="xfce4-session xfce4-panel xfce4-settings xfconf xfdesktop xfwm4 xfce4-appfinder xfce4-terminal xfce4-notifyd xfce4-whiskermenu-plugin Thunar tumbler mousepad dbus dbus-x11 adwaita-icon-theme dejavu-fonts-ttf"

# Installed where the distro has them: GTK's SVG icon loader (Ubuntu 24.04
# shows PNG fallback icons without it).
DE_PKGS_OPTIONAL_apt="librsvg2-common"
DE_PKGS_OPTIONAL_dnf="librsvg2"

# /etc/xdg/autostart entries that fail under proot (no polkitd), hidden so
# they don't pop up error dialogs. Fedora's xfce4-session requires xfce-polkit.
DE_AUTOSTART_HIDE="xfce-polkit pulseaudio tracker-miner-fs-3 geoclue-demo-agent update-notifier xiccd print-applet blueman nm-applet org.gnome.Evolution-alarm-notify xfce4-power-manager xscreensaver light-locker"

# The light profile (andronix tune, automatic below 3 GB of RAM).
DE_LIGHT_XFCONF="xfwm4:/general/use_compositing:bool:false;xfwm4:/general/box_move:bool:true;xfwm4:/general/box_resize:bool:true;thunar:/misc-thumbnail-mode:string:THUNAR_THUMBNAIL_MODE_NEVER;xfce4-desktop:/desktop-icons/show-thumbnails:bool:false"
DE_LIGHT_AUTOSTART_HIDE="at-spi-dbus-bus tracker-miner-fs-3 xfce4-power-manager xscreensaver light-locker blueman nm-applet"

# Approximate installed size for the free-space check (MB), and RAM hint.
DE_DISK_MB=1400
DE_MIN_RAM_MB=0
