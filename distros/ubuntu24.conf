# Ubuntu 24.04 LTS "Noble Numbat", for the app's Ubuntu18 and Ubuntu20 keys. One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=ubuntu24
DISTRO_NAME="Ubuntu"
DISTRO_VERSION="24.04"
DISTRO_CODENAME="noble"

DISTRO_FAMILY=apt
DISTRO_IMAGE="docker.io/library/ubuntu:24.04"
# Ubuntu 24.04 has no i386 build.
DISTRO_ARCHES="aarch64 arm x86_64"
DISTRO_SHELL=/bin/bash

DISTRO_BASE_PKGS="sudo nano wget ca-certificates tzdata procps"
# Ubuntu's own firefox package is a snap, and snaps can't run under proot.
# Use Mozilla's APT repository instead (arm64 and amd64 only), and pin
# snapd away so nothing pulls it in.
DISTRO_BROWSER="firefox"
DISTRO_BROWSER_CODECS="libavcodec-extra"
DISTRO_BROWSER_REPO="mozilla"
DISTRO_BROWSER_ARCHES="aarch64 x86_64"
DISTRO_NO_SNAP=1

DISTRO_DOWNLOAD_MB=35
DISTRO_DISK_MB=200

# Compatibility. The docs use start-ubuntu.sh (Ubuntu 18.04) and
# start-ubuntu20.sh (Ubuntu 20.04); both keys now install 24.04.
DISTRO_START_SCRIPTS="start-ubuntu.sh start-ubuntu20.sh"
DISTRO_LEGACY_FS="ubuntu-fs ubuntu20-fs"
DISTRO_BINDS_DIR="ubuntu-binds"
DISTRO_ALIASES="ubuntu2404 noble ubuntu18 ubuntu20 Ubuntu18 Ubuntu20"
