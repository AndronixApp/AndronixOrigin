# Ubuntu 26.04 LTS "Resolute Raccoon". One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=ubuntu
DISTRO_NAME="Ubuntu"
DISTRO_VERSION="26.04"
DISTRO_CODENAME="resolute"

DISTRO_FAMILY=apt
DISTRO_IMAGE="docker.io/library/ubuntu:26.04"
# Ubuntu 26.04 has no i386 build.
DISTRO_ARCHES="aarch64 arm x86_64"
DISTRO_SHELL=/bin/bash

DISTRO_BASE_PKGS="sudo nano wget ca-certificates tzdata procps"
# Ubuntu's own firefox package is a snap, and snaps can't run under proot.
# Use Mozilla's APT repository instead (arm64 and amd64 only), and pin
# snapd away so nothing pulls it in.
DISTRO_BROWSER="firefox"
DISTRO_BROWSER_REPO="mozilla"
DISTRO_BROWSER_ARCHES="aarch64 x86_64"
DISTRO_NO_SNAP=1

DISTRO_DOWNLOAD_MB=35
DISTRO_DISK_MB=200

# Compatibility. The app's Ubuntu22 key installs 26.04 (Ubuntu18 and
# Ubuntu20 install 24.04, see ubuntu24.conf). The old Ubuntu22 installer
# wrote start-ubuntu22.sh, so that name works too.
DISTRO_START_SCRIPTS="start-ubuntu26.sh start-ubuntu22.sh"
DISTRO_LEGACY_FS="ubuntu22-fs"
DISTRO_BINDS_DIR="ubuntu22-binds"
DISTRO_ALIASES="ubuntu26 ubuntu2604 resolute ubuntu22 Ubuntu22"

# Run as root after each package refresh and before any upgrade (install,
# andronix update, and the CI rootfs build). Ubuntu 26.04 ships the Rust
# coreutils; its multicall binary refuses to run through proot's
# link2symlink links after an upgrade ("Requested utility env does not
# match executable name: /usr/bin/.l2s.coreutils..."), which breaks
# /usr/bin/env and every package script (Play Store Termux). Ubuntu's own
# switch to GNU coreutils avoids it. Idempotent.
DISTRO_PRE_UPGRADE="! dpkg -s coreutils-from-uutils >/dev/null 2>&1 || dpkg -s coreutils-from-gnu >/dev/null 2>&1 || DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Use-Pty=0 --allow-remove-essential install coreutils-from-gnu coreutils-from-uutils-"
