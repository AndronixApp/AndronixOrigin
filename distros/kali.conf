# Kali Linux rolling. One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=kali
DISTRO_NAME="Kali Linux"
DISTRO_VERSION="rolling"
DISTRO_CODENAME="kali-rolling"

# Package-manager family: families/<family>.sh
DISTRO_FAMILY=apt

# OCI image used by CI to build the tarball, and by the registry fallback.
DISTRO_IMAGE="docker.io/kalilinux/kali-rolling:latest"

# Swap the package source. http.kali.org redirects each download to a
# random mirror, some of them https-only, which fails before
# ca-certificates is installed. kali.download is Kali's CDN: plain http,
# no redirects. Format: "<from> <to>", a literal replace in the sources.
DISTRO_MIRROR_REWRITE="http://http.kali.org/kali/ http://kali.download/kali/"

# CPUs we ship (Andronix names: aarch64 arm i686 x86_64).
DISTRO_ARCHES="aarch64 arm i686 x86_64"

# Login shell inside the distro.
DISTRO_SHELL=/bin/bash

# Extra packages every install gets, and the browser for desktop installs.
# systemd-standalone-tmpfiles/-sysusers satisfy sudo's and dbus's
# "systemd | systemd-standalone-tmpfiles" without the full systemd: Kali's
# systemd 261 postinst fails under proot on older kernels ("Failed to
# enable units: Protocol driver not attached", Redmi Note 7 Pro, 4.14),
# which leaves sudo, dbus and the whole desktop unconfigured. Nothing in a
# proot session runs systemd anyway.
DISTRO_BASE_PKGS="systemd-standalone-tmpfiles systemd-standalone-sysusers sudo nano wget ca-certificates tzdata procps"
DISTRO_BROWSER="firefox-esr"
DISTRO_BROWSER_CODECS="libavcodec-extra"

# Approximate sizes for the free-space check (MB).
DISTRO_DOWNLOAD_MB=60
DISTRO_DISK_MB=250

# Compatibility with the old installers and the app.
DISTRO_START_SCRIPTS="start-kali.sh"
DISTRO_LEGACY_FS="kali-fs"
DISTRO_BINDS_DIR="kali-binds"
DISTRO_ALIASES="kali-rolling kalilinux Kali"

# Run as root after each package refresh, before upgrades (install and
# andronix update). Repairs installs whose systemd was left unconfigured by
# the failure above: swap it for the standalone tmpfiles/sysusers, which
# lets dpkg finish configuring sudo, dbus and the desktop.
DISTRO_PRE_UPGRADE="! dpkg -s systemd >/dev/null 2>&1 || dpkg -s systemd 2>/dev/null | grep -q '^Status: install ok installed' || DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Use-Pty=0 install systemd-standalone-tmpfiles systemd-standalone-sysusers systemd-"
