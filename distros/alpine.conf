# Alpine Linux 3.24 (musl). One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=alpine
DISTRO_NAME="Alpine"
DISTRO_VERSION="3.24"
DISTRO_CODENAME=""

DISTRO_FAMILY=apk

DISTRO_IMAGE="docker.io/library/alpine:3.24"

DISTRO_ARCHES="aarch64 arm i686 x86_64"

# The image has only busybox ash; bash comes with DISTRO_BASE_PKGS and the
# VNC helpers need it.
DISTRO_SHELL=/bin/bash

DISTRO_BASE_PKGS="bash sudo nano wget ca-certificates tzdata procps shadow"
DISTRO_BROWSER="firefox"

DISTRO_DOWNLOAD_MB=5
DISTRO_DISK_MB=15

DISTRO_START_SCRIPTS="start-alpine.sh"
DISTRO_LEGACY_FS="alpine-fs"
DISTRO_BINDS_DIR="alpine-binds"
DISTRO_ALIASES="alpine3 alpine324 Alpine"
