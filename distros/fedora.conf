# Fedora 44. One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=fedora
DISTRO_NAME="Fedora"
DISTRO_VERSION="44"
DISTRO_CODENAME=""

# Package-manager family: families/<family>.sh
DISTRO_FAMILY=dnf

# OCI image used by CI to build the tarball, and by the registry fallback.
DISTRO_IMAGE="docker.io/library/fedora:44"

# CPUs we ship (Andronix names: aarch64 arm i686 x86_64). Fedora dropped
# 32-bit ARM and x86.
DISTRO_ARCHES="aarch64 x86_64"

# Login shell inside the distro.
DISTRO_SHELL=/bin/bash

# Extra packages every install gets, and the browser for desktop installs.
DISTRO_BASE_PKGS="sudo nano wget ca-certificates tzdata procps-ng"
DISTRO_BROWSER="firefox"

# Approximate sizes for the free-space check (MB).
DISTRO_DOWNLOAD_MB=70
DISTRO_DISK_MB=300

# Compatibility with the old installers and the app.
DISTRO_START_SCRIPTS="start-fedora.sh"
DISTRO_LEGACY_FS="fedora-fs"
DISTRO_BINDS_DIR="fedora-binds"
DISTRO_ALIASES="fedora44 Fedora"
