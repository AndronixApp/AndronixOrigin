# Void Linux (glibc, rolling). One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=void
DISTRO_NAME="Void"
DISTRO_VERSION="rolling"
DISTRO_CODENAME=""

DISTRO_FAMILY=xbps

DISTRO_IMAGE="ghcr.io/void-linux/void-glibc:latest"

# ghcr publishes amd64, 386, arm64, arm/v7 and arm/v6 for void-glibc.
DISTRO_ARCHES="aarch64 arm i686 x86_64"

# The image has no bash; it comes with DISTRO_BASE_PKGS.
DISTRO_SHELL=/bin/bash

DISTRO_BASE_PKGS="bash sudo nano wget ca-certificates tzdata procps-ng shadow tar gzip xz"
DISTRO_BROWSER="firefox"

DISTRO_DOWNLOAD_MB=30
DISTRO_DISK_MB=90

DISTRO_START_SCRIPTS="start-void.sh"
DISTRO_LEGACY_FS="void-fs"
DISTRO_BINDS_DIR="void-binds"
DISTRO_ALIASES="voidlinux void-linux Void"

# Added on master for the Go installer: sudo with a password fails under proot here; grant NOPASSWD instead.
DISTRO_SUDO=nopasswd
