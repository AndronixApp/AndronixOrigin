# Modded keys (ModdedOS.*): the andronix arguments for each. The app runs
#   curl -fsSLo andronix-get.sh https://dl.andronix.app/get.sh && sh andronix-get.sh <arguments>
# with its token in place of @TOKEN@, single-quoted as written (it has &).
# make-shims.sh skips these lines. Archived editions, rebuilt on current
# bases (owner decision); editions.conf has the list.
ModdedOS.Legacy.UbuntuXfce.Install    install --edition legacy-ubuntu-xfce --token '@TOKEN@'
ModdedOS.Legacy.UbuntuXfce.Uninstall  remove ubuntu
ModdedOS.Legacy.UbuntuKde.Install     install --edition legacy-ubuntu-kde --token '@TOKEN@'
ModdedOS.Legacy.UbuntuKde.Uninstall   remove ubuntu
ModdedOS.Legacy.Manjaro.Install       install --edition legacy-manjaro --token '@TOKEN@'
ModdedOS.Legacy.Manjaro.Uninstall     remove manjaro
ModdedOS.Legacy.Debian.Install        install --edition legacy-debian --token '@TOKEN@'
ModdedOS.Legacy.Debian.Uninstall      remove debian
