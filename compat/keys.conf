# App (Firestore) install keys -> andronix arguments, generated from the
# links/links backup (internal/conf/testdata/app-keys.tsv); used by
# make-shims.sh. One line per AndronixOrigin installer the app runs:
#   <installer path> <distro> <desktop>
# Retired options keep working: lxde installs LXQt, and enlightenment and
# the window managers (i3, awesome, openbox) install XFCE, each with a
# notice (conf.ResolveDesktopCompat). The user decides later whether the
# WM buttons change.
